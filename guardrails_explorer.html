<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardrails Explorer | Bamboo-GI 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --aviva-blue: #004fb6;
            --aviva-yellow: #ffcc00;
            --white: #ffffff;
            --dark-bg: #0b0f19;
            --card-bg: #161b22;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--dark-bg);
            color: #f0f6fc;
            margin: 0;
            scroll-behavior: smooth;
        }

        .bg-aviva-blue {
            background-color: var(--aviva-blue);
        }

        .text-aviva-blue {
            color: var(--aviva-blue);
        }

        .bg-aviva-yellow {
            background-color: var(--aviva-yellow);
        }

        .text-aviva-yellow {
            color: var(--aviva-yellow);
        }

        .nav {
            background: rgba(13, 17, 23, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #30363d;
        }

        .search-container {
            position: relative;
            max-width: 600px;
            margin: 0 auto;
        }

        .search-input {
            width: 100%;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 2rem;
            padding: 1rem 1.5rem 1rem 3.5rem;
            outline: none;
            transition: 0.3s;
        }

        .search-input:focus {
            border-color: var(--aviva-blue);
            box-shadow: 0 0 0 2px rgba(0, 79, 182, 0.3);
        }

        .template-card {
            background: var(--card-bg);
            border: 1px solid #30363d;
            border-radius: 12px;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
        }

        .template-card:hover {
            border-color: #8b949e;
            transform: translateY(-4px);
        }

        .template-card.featured {
            border: 2px solid var(--aviva-yellow);
            position: relative;
            background: linear-gradient(145deg, #161b22 0%, #1c2128 100%);
        }

        .featured-badge {
            position: absolute;
            top: -12px;
            right: 20px;
            background: var(--aviva-yellow);
            color: var(--aviva-blue);
            font-size: 0.6rem;
            font-weight: 900;
            padding: 2px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .btn-action {
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .btn-view {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
        }

        .btn-view:hover {
            background: #30363d;
        }

        .btn-copy {
            background: #238636;
            color: white;
            border: 1px solid rgba(240, 246, 252, 0.1);
        }

        .btn-copy:hover {
            background: #2ea043;
        }

        .btn-download {
            background: var(--aviva-blue);
            color: white;
        }

        .btn-download:hover {
            opacity: 0.9;
        }

        /* Modal Styles */
        #modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: var(--card-bg);
            width: 100%;
            max-width: 850px;
            max-height: 85vh;
            border-radius: 12px;
            border: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            items-center;
            padding: 16px 24px;
            border-bottom: 1px solid #30363d;
        }

        .modal-body {
            overflow-y: auto;
            padding: 24px;
            font-family: 'Cascadia Code', 'Consolas', 'Monaco', monospace;
            white-space: pre-wrap;
            font-size: 0.9rem;
            background: #0d1117;
            color: #e6edf3;
            line-height: 1.6;
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid #30363d;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            background: #161b22;
            border-radius: 0 0 12px 12px;
        }

        .category-pill {
            cursor: pointer;
            padding: 6px 16px;
            border-radius: 1.5rem;
            border: 1px solid #30363d;
            font-size: 0.75rem;
            transition: 0.2s;
            background: #161b22;
            color: #8b949e;
            font-weight: 600;
        }

        .category-pill.active {
            background: var(--aviva-blue);
            border-color: var(--aviva-blue);
            color: white;
        }

        .category-pill:hover:not(.active) {
            border-color: #8b949e;
            color: #f0f6fc;
        }
    </style>
</head>

<body class="antialiased">

    <!-- Nav -->
    <nav class="nav fixed w-full top-0 px-8 py-4 flex justify-between items-center z-50">
        <div class="flex items-center gap-2">
            <div
                class="w-8 h-8 bg-aviva-blue rounded flex items-center justify-center text-aviva-yellow font-bold text-lg">
                E</div>
            <span class="font-bold tracking-tight text-lg">Guardrails Explorer</span>
        </div>
        <div class="flex gap-6 items-center">
            <span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest hidden sm:block">Bamboo-GI
                2026</span>
            <a href="index.html"
                class="text-xs font-semibold text-gray-400 hover:text-aviva-yellow transition-colors flex items-center gap-2">
                <span>←</span> Back to Briefing
            </a>
        </div>
    </nav>

    <!-- Hero -->
    <section class="pt-32 pb-16 px-8 text-center bg-gradient-to-b from-[#0d1117] to-transparent">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-4xl md:text-6xl font-black mb-6 text-white leading-tight">
                Guardrails <span class="text-aviva-yellow">Explorer</span>
            </h1>
            <p class="text-gray-400 text-lg mb-10 max-w-2xl mx-auto font-light">
                The hub for Enterprise Context Engineering. Browse, standardize, and customize your repo's AI
                interactions in seconds.
            </p>

            <!-- Search Bar -->
            <div class="search-container mb-8">
                <span class="absolute left-5 top-1/2 -translate-y-1/2 text-gray-500 pointer-events-none">🔍</span>
                <input type="text" id="searchInput" onkeyup="filterTemplates()"
                    placeholder="Search tech (e.g., .NET, React, Python, Azure)..."
                    class="search-input text-white text-base">
            </div>

            <!-- Filter Chips -->
            <div class="flex flex-wrap justify-center gap-3" id="categoryFilters">
                <button class="category-pill active" onclick="filterCategory('All')">All Templates</button>
                <button class="category-pill" onclick="filterCategory('Core')">Starter Kit</button>
                <button class="category-pill" onclick="filterCategory('Backend')">Backend</button>
                <button class="category-pill" onclick="filterCategory('Frontend')">Frontend</button>
                <button class="category-pill" onclick="filterCategory('Cloud')">Cloud/IaC</button>
                <button class="category-pill" onclick="filterCategory('Security')">Security</button>
            </div>
        </div>
    </section>

    <!-- Templates Grid -->
    <main class="px-8 pb-24 max-w-7xl mx-auto">
        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8" id="templateGrid">
            <!-- Cards will be injected by JS -->
        </div>
    </main>

    <!-- Modal for Viewing -->
    <div id="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="modalTitle" class="font-bold text-lg text-white">Template Preview</h3>
                <button onclick="closeModal()"
                    class="text-gray-500 hover:text-white transition-colors text-2xl leading-none">&times;</button>
            </div>
            <div id="modalBody" class="modal-body"></div>
            <div class="modal-footer">
                <button id="modalCopy" class="btn-action btn-copy px-8 py-3">Copy Contents</button>
                <button onclick="closeModal()" class="btn-action btn-view px-8 py-3">Close</button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast"
        class="fixed bottom-10 right-10 bg-aviva-blue text-white px-8 py-4 rounded-xl shadow-2xl translate-y-20 opacity-0 transition-all duration-300 z-[200] font-bold border border-white/10">
        Copied to Clipboard!
    </div>

    <script>
        const templates = [
            {
                id: 0,
                title: "copilot-instructions.md",
                category: "Core",
                tech: "global github copilot base framework instructions",
                size: "2.1 KB",
                featured: true,
                content: "# .github/copilot-instructions.md\\n# Base Framework: Global Project Guardrails\\n\\n## Instructions for Teams\\n1. Create a .github folder at the root of your repository if it doesn't exist.\\n2. Create a file named copilot-instructions.md inside that folder.\\n3. Copy and paste the contents of this template into that file.\\n4. Customize the Project Context and Specific Standards sections below to match your project needs.\\n\\n---\\n\\n## Project Context\\n* **Project Name**: [Add Project Name Here]\\n* **Domain**: [Add Domain e.g., Insurance, Finance, etc.]\\n* **Primary Tech Stack**: [Add Primary Language/Frameworks]\\n\\n## Rules of Engagement\\n* Always adhere to DRY (Don't Repeat Yourself) and SOLID principles.\\n* Ensure all code follows our internal naming conventions.\\n* For all new features, generate corresponding unit tests using our preferred framework.\\n* Prioritize readability and maintainability over clever one-liners.\\n\\n## Security & Compliance\\n* Never hardcode API keys, secrets, or PII.\\n* Follow OWASP Top 10 guidelines for all web-facing code.\\n* Use our standardized logging library for all application events."
            },
            {
                id: 1,
                title: ".NET Core Backend",
                category: "Backend",
                tech: ".net core c# webapi microservices",
                size: "4.2 KB",
                content: "# .github/copilot-instructions.md\\n# Context for .NET Core Backend Services\\n\\n## Coding Style\\n- Use C# 11/12 features (Primary Constructors, Collection Expressions).\\n- Follow File-scoped namespaces.\\n- Prefer LINQ for data manipulation but avoid over-complex single-line chains.\\n\\n## Architecture\\n- Use Clean Architecture principles.\\n- Enforce Dependency Injection for all services.\\n- Repositories should only return DTOs, never Domain Entities to the Controller.\\n\\n## Testing\\n- Framework: xUnit.\\n- Mocking: NSubstitute.\\n- Assertion: FluentAssertions."
            },
            {
                id: 2,
                title: "React & TypeScript",
                category: "Frontend",
                tech: "react typescript ts nextjs tailwind frontend",
                size: "3.5 KB",
                content: "# .github/copilot-instructions.md\\n# Context for React Frontend Applications\\n\\n## Components\\n- Prefer Functional Components with Hooks over Class Components.\\n- Use Tailwind CSS for 90% of styling.\\n- Naming: PascalCase for components, camelCase for internal functions.\\n\\n## State Management\\n- Use React Context for global UI state.\\n- Use React Query (TanStack Query) for all server state/data fetching.\\n\\n## Standards\\n- Follow W3C Accessibility (a11y) standards.\\n- Use prop-types or TS interfaces for all dynamic data."
            },
            {
                id: 3,
                title: "Azure Infrastructure (Bicep)",
                category: "Cloud",
                tech: "azure bicep iac arm cloud portal terraform",
                size: "2.8 KB",
                content: "# .github/copilot-instructions.md\\n# Infrastructure as Code (Bicep/Azure)\\n\\n## Conventions\\n- Always include Resource Tags: [Project, Environment, Region, Owner].\\n- Use Bicep for all new infrastructure definitions.\\n- Resource naming: [service-type]-[project]-[env]-[region].\\n\\n## Best Practices\\n- Keep sensitive data (secrets) only in KeyVault.\\n- Use Managed Identities for service-to-service communication.\\n- No public IP addresses unless explicitly required by the Architect."
            },
            {
                id: 4,
                title: "Python DS & AI",
                category: "Backend",
                tech: "python pandas numpy ds ai ml fastapi",
                size: "5.1 KB",
                content: "# .github/copilot-instructions.md\\n# Context for Python DS/ML Projects\\n\\n## Standards\\n- Follow PEP 8 styles strictly.\\n- Use Type Hints for all function signatures.\\n- Document all core logic using Google-style Docstrings.\\n\\n## Stack\\n- Use Pandas for data manipulation.\\n- Use Poetry for dependency management.\\n- Prefer Pytest for units and integration tests."
            },
            {
                id: 5,
                title: "Security & OWASP",
                category: "Security",
                tech: "security owasp snyk checkmarx compliance vuln",
                size: "6.7 KB",
                content: "# .github/instructions/security.instructions.md\\n# Global Security Guardrails\\n\\n## Core Rules\\n- Apply OWASP Top 10 mitigations to every PR.\\n- No PII should be logged to the console or loggers (mask identifiers).\\n- All input validation must happen at the edge (API Layer).\\n\\n## Specifics\\n- Prevent SQL Injection by using Parameterized Queries only.\\n- Ensure all JWT validation includes issuer and audience checks.\\n- Use HTTPS/TLS 1.2+ for all transmissions."
            }
        ];

        let currentCategory = 'All';

        function renderTemplates() {
            const grid = document.getElementById('templateGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = '';

            const filtered = templates.filter(t => {
                const matchesSearch = t.title.toLowerCase().includes(search) || t.tech.toLowerCase().includes(search);
                const matchesCat = currentCategory === 'All' || t.category === currentCategory;
                return matchesSearch && matchesCat;
            });

            filtered.sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0));

            filtered.forEach(t => {
                const isFeatured = t.featured ? 'featured' : '';
                const badge = t.featured ? '<div class="featured-badge">Starter Kit</div>' : '';
                const displayContent = t.content.replace(/\\n/g, '\n');

                let card = '<div class="template-card ' + isFeatured + ' p-8 flex flex-col h-full">';
                card += badge;
                card += '<div class="flex justify-between items-start mb-4">';
                card += '<h3 class="font-bold text-xl text-white underline decoration-aviva-yellow decoration-2 underline-offset-4">' + t.title + '</h3>';
                card += '<span class="text-[10px] bg-aviva-blue/20 text-aviva-blue border border-aviva-blue/30 px-3 py-1 rounded-full font-black uppercase tracking-widest">' + t.category + '</span>';
                card += '</div>';
                card += '<p class="text-sm text-gray-400 mb-8 leading-relaxed">';
                card += (t.id === 0 ? "The universal starting point. Copy this into your repository's .github folder to establish global governance immediately." : "Standardized context engineering for " + t.tech.split(' ')[0] + " apps.");
                card += '</p>';
                card += '<div class="flex items-center justify-between mt-auto">';
                card += '<span class="text-[10px] text-gray-600 font-mono uppercase tracking-widest font-bold font-mono">' + t.size + '</span>';
                card += '<div class="flex gap-2">';
                card += '<button onclick="openModal(' + t.id + ')" class="btn-action btn-view" title="Explore Template Preview">👁️ View</button>';
                card += '<button onclick="copyToClipboard(templates[' + t.id + '].content)" class="btn-action btn-copy" title="Copy to Clipboard">📋 Copy</button>';
                card += '<button onclick="downloadMd(\'' + t.title + '\', templates[' + t.id + '].content)" class="btn-action btn-download" title="Download Markdown File">💾 Download</button>';
                card += '</div></div></div>';

                grid.innerHTML += card;
            });
        }

        function filterTemplates() { renderTemplates(); }

        function filterCategory(cat) {
            currentCategory = cat;
            const buttons = document.getElementById('categoryFilters').children;
            const displayNames = {
                'All': 'All Templates',
                'Core': 'Starter Kit',
                'Cloud': 'Cloud/IaC'
            };
            for (let b of buttons) {
                b.classList.remove('active');
                if (b.innerText === (displayNames[cat] || cat)) b.classList.add('active');
            }
            renderTemplates();
        }

        function openModal(id) {
            const t = templates.find(item => item.id == id);
            document.getElementById('modalTitle').innerText = t.title + " - Standard Preview";
            document.getElementById('modalBody').innerText = t.content.replace(/\\n/g, '\n');
            document.getElementById('modalCopy').onclick = () => copyToClipboard(t.content);
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function copyToClipboard(text) {
            const cleanText = text.replace(/\\n/g, '\n');
            navigator.clipboard.writeText(cleanText).then(() => {
                const toast = document.getElementById('toast');
                toast.style.opacity = '1';
                toast.style.transform = 'translateY(0)';
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateY(20px)';
                }, 2000);
            });
        }

        function downloadMd(title, content) {
            const cleanText = content.replace(/\\n/g, '\n');
            const blob = new Blob([cleanText], { type: 'text/markdown' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = title === 'copilot-instructions.md' ? 'copilot-instructions.md' : 'copilot-instructions-' + title.toLowerCase().replace(/ /g, '-') + '.md';
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);
        }

        // Initial Render
        renderTemplates();
    </script>

</body>

</html>
