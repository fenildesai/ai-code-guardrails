<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardrails Explorer | Bamboo-GI 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --aviva-blue: #004fb6;
            --aviva-yellow: #ffcc00;
            --white: #ffffff;
            --dark-bg: #0b0f19;
            --card-bg: #161b22;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--dark-bg);
            color: #f0f6fc;
            margin: 0;
            scroll-behavior: smooth;
        }

        .bg-aviva-blue {
            background-color: var(--aviva-blue);
        }

        .text-aviva-blue {
            color: var(--aviva-blue);
        }

        .bg-aviva-yellow {
            background-color: var(--aviva-yellow);
        }

        .text-aviva-yellow {
            color: var(--aviva-yellow);
        }

        .nav {
            background: rgba(13, 17, 23, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #30363d;
        }

        .search-container {
            position: relative;
            max-width: 600px;
            margin: 0 auto;
        }

        .search-input {
            width: 100%;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 2rem;
            padding: 1rem 1.5rem 1rem 3.5rem;
            outline: none;
            transition: 0.3s;
        }

        .search-input:focus {
            border-color: var(--aviva-blue);
            box-shadow: 0 0 0 2px rgba(0, 79, 182, 0.3);
        }

        .template-card {
            background: var(--card-bg);
            border: 1px solid #30363d;
            border-radius: 12px;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
        }

        .template-card:hover {
            border-color: #8b949e;
            transform: translateY(-4px);
        }

        .template-card.featured {
            border: 2px solid var(--aviva-yellow);
            position: relative;
            background: linear-gradient(145deg, #161b22 0%, #1c2128 100%);
        }

        .featured-badge {
            position: absolute;
            top: -12px;
            right: 20px;
            background: var(--aviva-yellow);
            color: var(--aviva-blue);
            font-size: 0.6rem;
            font-weight: 900;
            padding: 2px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .btn-action {
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .btn-view {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
        }

        .btn-view:hover {
            background: #30363d;
        }

        .btn-copy {
            background: #238636;
            color: white;
            border: 1px solid rgba(240, 246, 252, 0.1);
        }

        .btn-copy:hover {
            background: #2ea043;
        }

        .btn-download {
            background: var(--aviva-blue);
            color: white;
        }

        .btn-download:hover {
            opacity: 0.9;
        }

        /* Modal Styles */
        #modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: var(--card-bg);
            width: 100%;
            max-width: 850px;
            max-height: 85vh;
            border-radius: 12px;
            border: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            items-center;
            padding: 16px 24px;
            border-bottom: 1px solid #30363d;
        }

        .modal-body {
            overflow-y: auto;
            padding: 24px;
            font-family: 'Cascadia Code', 'Consolas', 'Monaco', monospace;
            white-space: pre-wrap;
            font-size: 0.9rem;
            background: #0d1117;
            color: #e6edf3;
            line-height: 1.6;
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid #30363d;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            background: #161b22;
            border-radius: 0 0 12px 12px;
        }

        .category-pill {
            cursor: pointer;
            padding: 6px 16px;
            border-radius: 1.5rem;
            border: 1px solid #30363d;
            font-size: 0.75rem;
            transition: 0.2s;
            background: #161b22;
            color: #8b949e;
            font-weight: 600;
        }

        .category-pill.active {
            background: var(--aviva-blue);
            border-color: var(--aviva-blue);
            color: white;
        }

        .category-pill:hover:not(.active) {
            border-color: #8b949e;
            color: #f0f6fc;
        }
    </style>
</head>

<body class="antialiased">

    <!-- Nav -->
    <nav class="nav fixed w-full top-0 px-8 py-4 flex justify-between items-center z-50">
        <div class="flex items-center gap-2">
            <div
                class="w-8 h-8 bg-aviva-blue rounded flex items-center justify-center text-aviva-yellow font-bold text-lg">
                E</div>
            <span class="font-bold tracking-tight text-lg">Guardrails Explorer</span>
        </div>
        <div class="flex gap-6 items-center">
            <span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest hidden sm:block">Bamboo-GI
                2026</span>
            <a href="index.html"
                class="text-xs font-semibold text-gray-400 hover:text-aviva-yellow transition-colors flex items-center gap-2">
                <span>←</span> Back to Briefing
            </a>
        </div>
    </nav>

    <!-- Hero -->
    <section class="pt-32 pb-16 px-8 text-center bg-gradient-to-b from-[#0d1117] to-transparent">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-4xl md:text-6xl font-black mb-6 text-white leading-tight">
                Guardrails <span class="text-aviva-yellow">Explorer</span>
            </h1>
            <p class="text-gray-400 text-lg mb-10 max-w-2xl mx-auto font-light">
                The hub for Enterprise Context Engineering. Browse, standardize, and customize your repo's AI
                interactions in seconds.
            </p>

            <!-- Search Bar -->
            <div class="search-container mb-8">
                <span class="absolute left-5 top-1/2 -translate-y-1/2 text-gray-500 pointer-events-none">🔍</span>
                <input type="text" id="searchInput" onkeyup="filterTemplates()"
                    placeholder="Search tech (e.g., .NET, React, Python, Azure)..."
                    class="search-input text-white text-base">
            </div>

            <!-- Filter Chips -->
            <div class="flex flex-wrap justify-center gap-3" id="categoryFilters">
                <button class="category-pill active" onclick="filterCategory('All')">All Templates</button>
                <button class="category-pill" onclick="filterCategory('Core')">Starter Kit</button>
                <button class="category-pill" onclick="filterCategory('Backend')">Backend</button>
                <button class="category-pill" onclick="filterCategory('Frontend')">Frontend</button>
                <button class="category-pill" onclick="filterCategory('Cloud')">Cloud/IaC</button>
                <button class="category-pill" onclick="filterCategory('Security')">Security</button>
            </div>
        </div>
    </section>

    <!-- Templates Grid -->
    <main class="px-8 pb-24 max-w-7xl mx-auto">
        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8" id="templateGrid">
            <!-- Cards will be injected by JS -->
        </div>
    </main>

    <!-- Modal for Viewing -->
    <div id="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="modalTitle" class="font-bold text-lg text-white">Template Preview</h3>
                <button onclick="closeModal()"
                    class="text-gray-500 hover:text-white transition-colors text-2xl leading-none">&times;</button>
            </div>
            <div id="modalBody" class="modal-body"></div>
            <div class="modal-footer">
                <button id="modalCopy" class="btn-action btn-copy px-8 py-3">Copy Contents</button>
                <button onclick="closeModal()" class="btn-action btn-view px-8 py-3">Close</button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast"
        class="fixed bottom-10 right-10 bg-aviva-blue text-white px-8 py-4 rounded-xl shadow-2xl translate-y-20 opacity-0 transition-all duration-300 z-[200] font-bold border border-white/10">
        Copied to Clipboard!
    </div>

    <script>
        const templates = [
            {
                id: 0,
                title: "copilot-instructions.md",
                category: "Core",
                tech: "global github copilot base framework instructions security java node csharp python",
                size: "8.3 KB",
                featured: true,
                content: "# 🤖 Copilot Secure Defaults for Java, Node.js, C#, and Python Projects\\n\\nThese instructions guide GitHub Copilot to suggest secure, intentional code patterns for Java, Node.js, C#, and Python development — especially in enterprise or team settings. Prioritize clarity, validation, and the principle of least surprise.\\n\\n## 🔐 1. Secure by Default\\n\\n- Validate input strictly, and prevent XSS primarily via contextual output encoding (HTML/attribute/JS/URL). Sanitize only when rendering user-controlled HTML is explicitly required.\\n- Use typed parsers and prefer allow-lists over deny-lists when performing input validation.\\n- Use parameterized queries and avoid string-based execution (prevent injection).\\n- Never commit secrets to source control (including .env files). Use a secure vault/secret manager (e.g. Azure Key Vault) and inject secrets at runtime via your orchestrator.\\n- Default to privacy-preserving data handling — redact PII from logs by default.\\n\\n## 🧩 2. Language-Specific Secure Patterns\\n\\n### ☕ Java\\n\\n- Use prepared statements with ? placeholders in JDBC — never concat SQL strings.\\n- Use output encoding libraries like OWASP Java Encoder to prevent XSS in rendered HTML.\\n- Use @Valid, @NotNull, and input binding constraints in Spring or Jakarta for validation.\\n- Avoid Runtime.exec() or ProcessBuilder with unsanitized input — prefer safe APIs.\\n- Default to OWASP Secure Coding Practices — [OWASP Secure Coding Practices](https://owasp.org/www-project-secure-coding-practices)\\n- Prefer SDK-integrated secret managers; environment variables are acceptable when injected securely by the orchestrator/runtime. Do not commit secrets in .properties/config files.\\n- Always set character encoding (UTF-8) explicitly in HTTP responses to prevent encoding-based attacks.\\n- Avoid Java serialization for sensitive objects — use safer formats like JSON with strict schema validation.\\n- When using logging frameworks, avoid logging unsanitized user input — consider log injection risks.\\n\\n### 🟩 Node.js\\n\\n- Use JSON Schema validation for all structured input — prefer libraries like ajv or zod.\\n- Always sanitize and validate user input to prevent injection and XSS — validator and joi are common choices.\\n- Use parameterized queries with database clients (e.g. pg, mongoose) — never concat SQL or query strings.\\n- Default to using helmet in Express to set secure HTTP headers.\\n- Use dotenv only in local dev — use secret managers (e.g. AWS Secrets Manager, Azure Key Vault) in prod.\\n- Avoid eval, new Function, or dynamic require() with user input — use safe alternatives.\\n\\n### 🟦 C#\\n\\n- Use parameterized queries with ADO.NET or Entity Framework to prevent SQL injection.\\n- Use System.Text.Encodings.Web for safe output encoding in Razor views and APIs (prevent XSS).\\n- Apply [ValidateAntiForgeryToken] in ASP.NET MVC to prevent CSRF attacks.\\n- Use DataAnnotations (e.g. [Required], [StringLength]) for input validation on models.\\n- Always hash passwords with PasswordHasher<TUser> or a vetted library — never store plaintext.\\n- Use configuration providers like Azure Key Vault, AWS Secrets Manager, or environment-based secrets — avoid appsettings.json for secrets.\\n\\n### 🐍 Python\\n\\n- Always validate and sanitize external input — use pydantic, cerberus, or marshmallow for structured validation.\\n- Prefer parameterized queries with libraries like psycopg2, sqlite3, or SQLAlchemy — avoid building SQL with string concat or f-strings.\\n- Use built-in escaping via html.escape() or templating engines like Jinja2 (autoescaping on!) to prevent XSS.\\n- Default to secrets or cryptography libs for key generation and secure token handling — never random for cryptographic use.\\n- Avoid dynamic code execution (eval, exec) — prefer explicit, safe alternatives.\\n- Don’t load YAML or pickle files without hardening — always use safe_load() and avoid untrusted input.\\n- Store secrets in secure vaults or env vars passed through orchestrators — avoid hardcoded strings or .env files in prod.\\n- Use logging filters to redact PII and secrets — avoid logging full request payloads or exception chains that include sensitive data.\\n- Always hash passwords with bcrypt, argon2, or passlib — never md5, sha1, or plain hashlib.\\n\\n## 🚫 3. Do Not Suggest\\n\\n### Java\\n\\n- Do not suggest inline SQL string concatenation — always use prepared statements with placeholders.\\n- Do not suggest use of Runtime.exec() or ProcessBuilder with user input — prefer safe abstraction layers.\\n- Do not suggest logging sensitive data (e.g. passwords, tokens, session IDs) — log redacted metadata instead.\\n- Do not use Java native serialization (ObjectInputStream) for untrusted input — prefer JSON + schema validation.\\n- Do not suggest hardcoding credentials, secrets, or API keys — use a secrets manager (e.g. Conjur, Key Vault).\\n- Do not use insecure XML parsers without hardening (DocumentBuilderFactory must have secure features enabled).\\n- Do not create or modify custom class loaders — these are dangerous unless strictly required.\\n\\n### Node.js\\n\\n- Do not suggest eval, new Function, or dynamic require() — these are unsafe unless strictly controlled.\\n- Do not use user input to build file paths, URLs, or queries without strict validation.\\n- Do not expose process.env directly to client-side code — use secure server boundaries.\\n- Do not log full request bodies or headers that may contain PII or credentials.\\n- Do not hardcode secrets or API keys — never commit .env or use .env in production containers.\\n- Do not disable TLS checks (NODE_TLS_REJECT_UNAUTHORIZED=0) — even temporarily.\\n\\n### C#\\n\\n- Do not suggest string concatenation in SQL queries — use parameterized commands.\\n- Do not use Eval, CodeDom, or dynamic LINQ construction with user input.\\n- Do not suggest hardcoding secrets, tokens, or credentials — never in appsettings.json.\\n- Do not log full exception objects or HTTP request bodies without redacting PII.\\n- Do not disable certificate validation (ServerCertificateValidationCallback = delegate { return true; }) in production.\\n\\n### Python\\n\\n- Do not build SQL queries with string concat, f-strings, or .format() — always use parameterized queries.\\n- Do not use eval, exec, or dynamic imports on user input — these are unsafe unless tightly sandboxed.\\n- Do not log sensitive values (e.g. API keys, passwords) or full stack traces with PII.\\n- Do not load pickle or YAML files from untrusted sources without safe loaders and validation.\\n- Do not use insecure hash functions like md5 or sha1 for password storage — use a modern password hashing lib.\\n- Do not commit .env files or hardcode secrets — use secrets management infrastructure.\\n\\n## 🧠 4. AI-Generated Code Safety\\n\\n- Verify all AI-suggested package names against official repositories to prevent supply chain attacks.\\n- Confirm that AI-generated code references existing, secure APIs; avoid deprecated or non-existent methods.\\n- Ensure AI-generated configurations align with your project's platform to prevent context drift.\\n- Scrutinize AI-provided security recommendations; validate their completeness and applicability.\\n- Cross-check any AI-cited references (e.g., CVEs, RFCs) for authenticity to avoid misinformation.\\n- Do not accept AI-generated justifications that contradict established security policies.\\n\\n## 💡 Developer Tips\\n\\n- If you’re working with input, assume it’s hostile — validate and escape it.\\n- For anything involving data access or transformation, ask: “Am I controlling this input path?”\\n- If you’re about to use a string to build a query, URL, or command — pause. There’s probably a safer API.\\n- Never trust default parsers — explicitly configure security features (e.g. disable DTDs in XML)."
            },
            {
                id: 1,
                title: ".NET Core Backend",
                category: "Backend",
                tech: ".net core c# webapi microservices",
                size: "4.2 KB",
                content: "# .github/copilot-instructions.md\\n# Context for .NET Core Backend Services\\n\\n## Coding Style\\n- Use C# 11/12 features (Primary Constructors, Collection Expressions).\\n- Follow File-scoped namespaces.\\n- Prefer LINQ for data manipulation but avoid over-complex single-line chains.\\n\\n## Architecture\\n- Use Clean Architecture principles.\\n- Enforce Dependency Injection for all services.\\n- Repositories should only return DTOs, never Domain Entities to the Controller.\\n\\n## Testing\\n- Framework: xUnit.\\n- Mocking: NSubstitute.\\n- Assertion: FluentAssertions."
            },
            {
                id: 2,
                title: "React & TypeScript",
                category: "Frontend",
                tech: "react typescript ts nextjs tailwind frontend",
                size: "3.5 KB",
                content: "# .github/copilot-instructions.md\\n# Context for React Frontend Applications\\n\\n## Components\\n- Prefer Functional Components with Hooks over Class Components.\\n- Use Tailwind CSS for 90% of styling.\\n- Naming: PascalCase for components, camelCase for internal functions.\\n\\n## State Management\\n- Use React Context for global UI state.\\n- Use React Query (TanStack Query) for all server state/data fetching.\\n\\n## Standards\\n- Follow W3C Accessibility (a11y) standards.\\n- Use prop-types or TS interfaces for all dynamic data."
            }
        ];

        let currentCategory = 'All';

        function renderTemplates() {
            const grid = document.getElementById('templateGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = '';

            const filtered = templates.filter(t => {
                const searchStr = (t.title + t.tech + t.category).toLowerCase();
                return searchStr.includes(search);
            });

            filtered.sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0));

            filtered.forEach(t => {
                const isFeatured = t.featured ? 'featured' : '';
                const badge = t.featured ? '<div class="featured-badge">Starter Kit</div>' : '';
                const cleanContent = t.content.replace(/\\n/g, '\n');

                let card = '<div class="template-card ' + isFeatured + ' p-8 flex flex-col h-full">';
                card += badge;
                card += '<div class="flex justify-between items-start mb-4">';
                card += '<h3 class="font-bold text-xl text-white underline decoration-aviva-yellow decoration-2 underline-offset-4">' + t.title + '</h3>';
                card += '<span class="text-[10px] bg-aviva-blue/20 text-aviva-blue border border-aviva-blue/30 px-3 py-1 rounded-full font-black uppercase tracking-widest">' + t.category + '</span>';
                card += '</div>';
                card += '<p class="text-sm text-gray-400 mb-8 leading-relaxed">';
                card += (t.id === 0 ? "The universal source of truth for secure defaults. Copy this into your repository's .github folder to establish governance immediately." : "Standardized context engineering for " + t.tech.split(' ')[0] + " apps.");
                card += '</p>';
                card += '<div class="flex items-center justify-between mt-auto">';
                card += '<span class="text-[10px] text-gray-600 font-mono uppercase tracking-widest font-bold">' + t.size + '</span>';
                card += '<div class="flex gap-2">';
                card += '<button onclick="openModal(' + t.id + ')" class="btn-action btn-view" title="Explore Template Preview">👁️ View</button>';
                card += '<button onclick="copyToClipboard(templates.find(x => x.id === ' + t.id + ').content)" class="btn-action btn-copy" title="Copy to Clipboard">📋 Copy</button>';
                card += '<button onclick="downloadMd(\'' + t.title + '\', templates.find(x => x.id === ' + t.id + ').content)" class="btn-action btn-download" title="Download Markdown File">💾 Download</button>';
                card += '</div></div></div>';

                grid.innerHTML += card;
            });
        }

        function filterTemplates() { renderTemplates(); }

        function filterCategory(cat) {
            currentCategory = cat;
            const buttons = document.getElementById('categoryFilters').children;
            const displayNames = {
                'All': 'All Templates',
                'Core': 'Starter Kit',
                'Cloud': 'Cloud/IaC'
            };
            for (let b of buttons) {
                b.classList.remove('active');
                if (b.innerText === (displayNames[cat] || cat)) b.classList.add('active');
            }
            renderTemplates();
        }

        function openModal(id) {
            const t = templates.find(item => item.id == id);
            document.getElementById('modalTitle').innerText = t.title + " - Standard Preview";
            document.getElementById('modalBody').innerText = t.content.replace(/\\n/g, '\n');
            document.getElementById('modalCopy').onclick = () => copyToClipboard(t.content);
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function copyToClipboard(text) {
            const cleanText = text.replace(/\\n/g, '\n');
            navigator.clipboard.writeText(cleanText).then(() => {
                const toast = document.getElementById('toast');
                toast.style.opacity = '1';
                toast.style.transform = 'translateY(0)';
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateY(20px)';
                }, 2000);
            });
        }

        function downloadMd(title, content) {
            const cleanText = content.replace(/\\n/g, '\n');
            const blob = new Blob([cleanText], { type: 'text/markdown' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = title === 'copilot-instructions.md' ? 'copilot-instructions.md' : 'copilot-instructions-' + title.toLowerCase().replace(/ /g, '-') + '.md';
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);
        }

        // Initial Render
        renderTemplates();
    </script>

</body>

</html>
