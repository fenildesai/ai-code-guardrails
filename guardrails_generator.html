<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardrails Generator | Bamboo-GI 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --aviva-blue: #004fb6;
            --aviva-yellow: #ffcc00;
            --white: #ffffff;
            --dark-bg: #0b0f19;
            --card-bg: #161b22;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--dark-bg);
            color: #f0f6fc;
            margin: 0;
        }

        .bg-aviva-blue {
            background-color: var(--aviva-blue);
        }

        .text-aviva-blue {
            color: var(--aviva-blue);
        }

        .bg-aviva-yellow {
            background-color: var(--aviva-yellow);
        }

        .text-aviva-yellow {
            color: var(--aviva-yellow);
        }

        .nav {
            background: rgba(13, 17, 23, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #30363d;
        }

        .search-container {
            position: relative;
            max-width: 600px;
            margin: 0 auto;
        }

        .search-input {
            width: 100%;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 2rem;
            padding: 1rem 1.5rem 1rem 3.5rem;
            outline: none;
            transition: 0.3s;
        }

        .search-input:focus {
            border-color: var(--aviva-blue);
            box-shadow: 0 0 0 2px rgba(0, 79, 182, 0.3);
        }

        .template-card {
            background: var(--card-bg);
            border: 1px solid #30363d;
            border-radius: 12px;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
        }

        .template-card:hover {
            border-color: #8b949e;
            transform: translateY(-4px);
        }

        .btn-action {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: 0.2s;
        }

        .btn-view {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
        }

        .btn-view:hover {
            background: #30363d;
        }

        .btn-copy {
            background: #238636;
            color: white;
            border: 1px solid rgba(240, 246, 252, 0.1);
        }

        .btn-copy:hover {
            background: #2ea043;
        }

        .btn-download {
            background: var(--aviva-blue);
            color: white;
        }

        .btn-download:hover {
            opacity: 0.9;
        }

        /* Modal Styles */
        #modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-bg);
            width: 100%;
            max-width: 800px;
            max-height: 80vh;
            border-radius: 12px;
            border: 1px solid #30363d;
            display: flex;
            flex-direction: column;
        }

        .modal-body {
            overflow-y: auto;
            padding: 20px;
            font-family: monospace;
            white-space: pre-wrap;
            font-size: 0.9rem;
            background: #0d1117;
        }

        .category-pill {
            cursor: pointer;
            padding: 4px 12px;
            border-radius: 1rem;
            border: 1px solid #30363d;
            font-size: 0.75rem;
            transition: 0.2s;
        }

        .category-pill.active {
            background: var(--aviva-blue);
            border-color: var(--aviva-blue);
            color: white;
        }
    </style>
</head>

<body class="antialiased">

    <!-- Nav -->
    <nav class="nav fixed w-full top-0 px-8 py-4 flex justify-between items-center z-50">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-aviva-blue rounded flex items-center justify-center text-aviva-yellow font-bold">G
            </div>
            <span class="font-bold tracking-tight">Guardrails Generator</span>
        </div>
        <div class="flex gap-4 items-center">
            <span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Bamboo-GI 2026</span>
            <a href="index.html" class="text-xs text-gray-400 hover:text-white">Back to Briefing</a>
        </div>
    </nav>

    <!-- Hero -->
    <section class="pt-32 pb-16 px-8 text-center bg-gradient-to-b from-[#0d1117] to-transparent">
        <h1 class="text-4xl md:text-6xl font-black mb-6 text-white leading-tight">
            Copilot Instructions <span class="bg-aviva-blue px-4 py-1 rounded inline-block">Generator</span>
        </h1>
        <p class="text-gray-400 text-lg mb-10 max-w-2xl mx-auto">
            Search and select instruction templates to create your custom <span
                class="text-aviva-yellow">copilot-instructions.md</span> file.
        </p>

        <!-- Search Bar -->
        <div class="search-container">
            <span class="absolute left-5 top-1/2 -translate-y-1/2 text-gray-500">🔍</span>
            <input type="text" id="searchInput" onkeyup="filterTemplates()"
                placeholder="Search tech (e.g., .NET, React, Python, Azure)..." class="search-input text-white">
        </div>

        <!-- Filter Chips -->
        <div class="flex flex-wrap justify-center gap-3 mt-8" id="categoryFilters">
            <button class="category-pill active" onclick="filterCategory('All')">All</button>
            <button class="category-pill" onclick="filterCategory('Backend')">Backend</button>
            <button class="category-pill" onclick="filterCategory('Frontend')">Frontend</button>
            <button class="category-pill" onclick="filterCategory('Cloud')">Cloud</button>
            <button class="category-pill" onclick="filterCategory('Security')">Security</button>
        </div>
    </section>

    <!-- Templates Grid -->
    <main class="px-8 pb-24 max-w-7xl mx-auto">
        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6" id="templateGrid">
            <!-- Cards will be injected by JS -->
        </div>
    </main>

    <!-- Modal for Viewing -->
    <div id="modal" onclick="closeModal()">
        <div class="modal-content animate-in zoom-in-95 duration-200" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center p-4 border-b border-gray-800">
                <h3 id="modalTitle" class="font-bold">Template Preview</h3>
                <button onclick="closeModal()" class="text-gray-500 hover:text-white">✕</button>
            </div>
            <div id="modalBody" class="modal-body text-green-500"></div>
            <div class="p-4 border-t border-gray-800 flex justify-end gap-3">
                <button id="modalCopy" class="btn-action btn-copy px-6 py-2">Copy to Clipboard</button>
                <button onclick="closeModal()" class="btn-action btn-view px-6 py-2">Close</button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast"
        class="fixed bottom-10 right-10 bg-aviva-blue text-white px-6 py-3 rounded-lg shadow-xl translate-y-20 opacity-0 transition-all duration-300 z-[200]">
        Copied to Clipboard!
    </div>

    <script>
        const templates = [
            {
                id: 1,
                title: ".NET Core Backend",
                category: "Backend",
                tech: ".net core c#",
                size: "4.2 KB",
                content: `# .github/copilot-instructions.md
# Context for .NET Core Backend Services

## Coding Style
- Use C# 11/12 features (Primary Constructors, Collection Expressions).
- Follow File-scoped namespaces.
- Prefer LINQ for data manipulation but avoid over-complex single-line chains.

## Architecture
- Use Clean Architecture principles.
- Enforce Dependency Injection for all services.
- Repositories should only return DTOs, never Domain Entities to the Controller.

## Testing
- Framework: xUnit.
- Mocking: NSubstitute.
- Assertion: FluentAssertions.
`
            },
            {
                id: 2,
                title: "React & TypeScript",
                category: "Frontend",
                tech: "react typescript ts js frontend",
                size: "3.5 KB",
                content: `# .github/copilot-instructions.md
# Context for React Frontend Applications

## Components
- Prefer Functional Components with Hooks over Class Components.
- Use Tailwind CSS for 90% of styling.
- Naming: PascalCase for components, camelCase for internal functions.

## State Management
- Use React Context for global UI state.
- Use React Query (TanStack Query) for all server state/data fetching.

## Standards
- Follow W3C Accessibility (a11y) standards.
- Use prop-types or TS interfaces for all dynamic data.
`
            },
            {
                id: 3,
                title: "Azure Cloud Infrastructure",
                category: "Cloud",
                tech: "azure bicep arm cloud portal finsops",
                size: "2.8 KB",
                content: `# .github/copilot-instructions.md
# Infrastructure as Code (Bicep/Azure)

## Conventions
- Always include Resource Tags: [Project, Environment, Region, Owner].
- Use Bicep for all new infrastructure definitions.
- Resource naming: [service-type]-[project]-[env]-[region].

## Best Practices
- Keep sensitive data (secrets) only in KeyVault.
- Use Managed Identities for service-to-service communication.
- No public IP addresses unless explicitly required by the Architect.
`
            },
            {
                id: 4,
                title: "Python Data Science",
                category: "Backend",
                tech: "python pandas numpy ds ai ml",
                size: "5.1 KB",
                content: `# .github/copilot-instructions.md
# Context for Python DS/ML Projects

## Standards
- Follow PEP 8 styles strictly.
- Use Type Hints for all function signatures.
- Document all core logic using Google-style Docstrings.

## Stack
- Use Pandas for data manipulation.
- Use Poetry or Conda for dependency management.
- Prefer Pytest for units and integration tests.
`
            },
            {
                id: 5,
                title: "Security & OWASP",
                category: "Security",
                tech: "security owasp snyk checkmarx vuln",
                size: "6.7 KB",
                content: `# .github/instructions/security.instructions.md
# Global Security Guardrails

## Core Rules
- Apply OWASP Top 10 mitigations to every PR.
- No PII should be logged to the console or loggers (mask identifiers).
- All input validation must happen at the edge (API Layer).

## Specifics
- Prevent SQL Injection by using Parameterized Queries only.
- Ensure all JWT validation includes issuer and audience checks.
- Use HTTPS/TLS 1.2+ for all transmissions.
`
            }
        ];

        let currentCategory = 'All';

        function renderTemplates() {
            const grid = document.getElementById('templateGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = '';

            const filtered = templates.filter(t => {
                const matchesSearch = t.title.toLowerCase().includes(search) || t.tech.toLowerCase().includes(search);
                const matchesCat = currentCategory === 'All' || t.category === currentCategory;
                return matchesSearch && matchesCat;
            });

            filtered.forEach(t => {
                grid.innerHTML += `
                    <div class="template-card p-6 flex flex-col h-full">
                        <div class="flex justify-between items-start mb-4">
                            <h3 class="font-bold text-lg">${t.title}</h3>
                            <span class="text-[10px] bg-gray-800 px-2 py-1 rounded text-gray-400 font-bold">${t.category}</span>
                        </div>
                        <p class="text-xs text-gray-500 mb-6 flex-grow">Optimized for ${t.tech.split(' ')[0]} environments with enterprise standards.</p>
                        <div class="flex items-center justify-between mt-auto">
                            <span class="text-[10px] text-gray-600 font-mono">${t.size}</span>
                            <div class="flex gap-2">
                                <button onclick="openModal('${t.id}')" class="btn-action btn-view" title="Preview">👁️</button>
                                <button onclick="copyToClipboard(\`${t.content.replace(/`/g, '\\`').replace(/\$/g, '\\$')}\`)" class="btn-action btn-copy" title="Copy">📋</button>
                                <button onclick="downloadMd('${t.title}', \`${t.content.replace(/`/g, '\\`').replace(/\$/g, '\\$')}\`)" class="btn-action btn-download" title="Download">💾</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function filterTemplates() { renderTemplates(); }

        function filterCategory(cat) {
            currentCategory = cat;
            const buttons = document.getElementById('categoryFilters').children;
            for (let b of buttons) {
                b.classList.remove('active');
                if (b.innerText === cat) b.classList.add('active');
            }
            renderTemplates();
        }

        function openModal(id) {
            const t = templates.find(item => item.id == id);
            document.getElementById('modalTitle').innerText = t.title + " - Preview";
            document.getElementById('modalBody').innerText = t.content;
            document.getElementById('modalCopy').onclick = () => copyToClipboard(t.content);
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById('toast');
                toast.style.opacity = '1';
                toast.style.transform = 'translateY(0)';
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateY(20px)';
                }, 2000);
            });
        }

        function downloadMd(title, content) {
            const blob = new Blob([content], { type: 'text/markdown' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `copilot-instructions-${title.toLowerCase().replace(/ /g, '-')}.md`;
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);
        }

        // Initial Render
        renderTemplates();
    </script>

</body>

</html>
